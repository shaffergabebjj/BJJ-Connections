name: Validate BJJ Connections
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/run-tests.js
      - run: node tests/tools-tests.js
      - run: node tests/practice-tests.js
      - run: node tests/timer-tests.js
      - run: node tests/resource-tests.js
      - run: node tests/offline-tests.js
      - run: node tests/experience-tests.js
