/* ---------------- GAME LOGIC ---------------- */

let used = [];
let puzzle = null;
let words = [];
let selected = [];
let solved = [];
let mistakes = 4;
let round = 0;

const grid = document.getElementById("grid");
const solvedBox = document.getElementById("solved");
const msg = document.getElementById("msg");
const mistakesEl = document.getElementById("mistakes");
const dots = document.getElementById("dots");
const submit = document.getElementById("submit");
const next = document.getElementById("next");
const roundNo = document.getElementById("roundNo");

function newRound(){
  if(used.length === rounds.length) used = [];

  const available = rounds.map((_,i)=>i).filter(i=>!used.includes(i));
  const index = available[Math.floor(Math.random()*available.length)];

  used.push(index);
  puzzle = rounds[index];

  words = puzzle.flatMap(g=>g.slice(0,4));
  selected = [];
  solved = [];
  mistakes = 4;
  round++;

  msg.textContent = "";
  next.style.display = "none";
  renderSolved();
  shuffle();
  update();
}

function render(){
  grid.innerHTML = "";

  words.forEach(word=>{
    const b = document.createElement("button");
    b.className = "word";
    b.textContent = word;

    if(selected.includes(word)) b.classList.add("sel");

    b.onclick = ()=>{
      if(selected.includes(word)){
        selected = selected.filter(x=>x!==word);
      }else if(selected.length < 4){
        selected.push(word);
      }
      render();
      update();
    };

    grid.appendChild(b);
  });
}

function submitGuess(){
  if(selected.length !== 4) return;

  const found = puzzle.find(g=>{
    const groupWords = g.slice(0,4);
    return selected.every(w=>groupWords.includes(w));
  });

  if(found){
    solved.push(found);
    words = words.filter(w=>!found.slice(0,4).includes(w));
    selected = [];
    msg.textContent = "Correct.";
    renderSolved();
    render();

    if(words.length === 0){
      msg.textContent = "Round complete.";
      next.style.display = "inline-block";
    }
  }else{
    mistakes--;
    selected = [];

    if(mistakes === 0){
      msg.textContent = "Game over. Start the next round.";
      next.style.display = "inline-block";
    }else{
      msg.textContent = "Not a group.";
    }

    render();
  }

  update();
}

function renderSolved(){
  solvedBox.innerHTML = "";

  solved.forEach(g=>{
    const box = document.createElement("div");
    box.className = "solved";
    box.innerHTML = "<b>"+g[4]+"</b>"+g.slice(0,4).join(" · ");
    solvedBox.appendChild(box);
  });
}

function shuffle(){
  for(let i=words.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [words[i],words[j]]=[words[j],words[i]];
  }
  render();
}

function update(){
  mistakesEl.textContent = mistakes;
  dots.textContent = "● ".repeat(mistakes).trim();
  submit.disabled = selected.length !== 4;
  roundNo.textContent = round;
}

submit.onclick = submitGuess;
document.getElementById("shuffle").onclick = shuffle;
next.onclick = newRound;

newRound();

</script>
</body>
</html>
