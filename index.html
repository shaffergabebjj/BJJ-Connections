<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BJJ Connections</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f5;
  color: #111;
  font-family: Arial, Helvetica, sans-serif;
}

.wrap {
  width: min(780px, 94vw);
  margin: auto;
  padding: 28px 0 45px;
}

.header {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 78px;
}

.title-area {
  text-align: center;
}

h1 {
  text-align: center;
  margin: 0;
  font-size: 38px;
}

.creator {
  text-align: center;
  font-size: 13px;
  color: #777;
  margin-top: 4px;
  font-weight: 600;
}

.connection-tracker {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #fff;
  border: 1px solid #999;
  border-radius: 6px;
  padding: 4px 8px;
  min-width: 74px;
  line-height: 1;
}

.connection-tracker span {
  font-size: 21px;
  font-weight: 800;
  line-height: 1;
}

.connection-tracker small {
  font-size: 9px;
  color: #666;
  font-weight: 700;
  margin-top: 3px;
  line-height: 1;
}

.sub {
  text-align: center;
  color: #666;
  margin: 7px 0 22px;
}

.bar {
  display: flex;
  justify-content: space-between;
  font-weight: 700;
  margin-bottom: 12px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
}

.word {
  min-height: 86px;
  border: 0;
  border-radius: 8px;
  background: #e8e8e5;
  font-weight: 800;
  font-size: 14px;
  padding: 7px;
  cursor: pointer;
}

.word:hover {
  background: #ddd;
}

.word.sel {
  background: #111;
  color: #fff;
}

.solved {
  padding: 14px 16px;
  border-radius: 8px;
  background: #d9ead3;
  margin-bottom: 8px;
}

.solved b {
  display: block;
  margin-bottom: 4px;
}

#msg {
  text-align: center;
  min-height: 24px;
  font-weight: 700;
  margin: 14px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 9px;
  flex-wrap: wrap;
}

button.ctrl {
  border: 1px solid #999;
  background: #fff;
  border-radius: 22px;
  padding: 10px 18px;
  font-weight: 700;
  cursor: pointer;
}

#submit,
#next {
  background: #111;
  color: #fff;
  border-color: #111;
}

#submit:disabled {
  opacity: .4;
  cursor: default;
}

#next {
  display: none;
}

.round {
  text-align: center;
  color: #777;
  margin-top: 12px;
  font-size: 13px;
}

@media(max-width:560px) {

  h1 {
    font-size: 30px;
  }

  .word {
    min-height: 72px;
    font-size: 11px;
  }

  .grid {
    gap: 6px;
  }

  .connection-tracker {
    left: 0;
    top: 0;
    min-width: 68px;
    padding: 4px 6px;
  }

  .connection-tracker span {
    font-size: 19px;
  }

  .connection-tracker small {
    font-size: 8px;
  }
}
</style>
</head>


<body>

["GORDON RYAN","CRAIG JONES","GARRY TONON","NICK RODRIGUEZ","NO-GI"],
["HEEL HOOK","KNEEBAR","CALF SLICER","STRAIGHT ANKLE","LEG LOCKS"],
["ASHI GARAMI","SINGLE LEG X","INSIDE SANKAKU","OUTSIDE ASHI","LEG POSITIONS"],
["BODY LOCK","KNEE CUT","SMASH PASS","OVER-UNDER","PASSES"]
],


/* ROUND 49 */
[
["ROGER GRACIE","LEANDRO LO","BUCHECHA","MARCUS ALMEIDA","GI LEGENDS"],
["MOUNT","BACK","SIDE CONTROL","NORTH-SOUTH","POSITIONS"],
["CROSS CHOKE","COLLAR CHOKE","EZEKIEL","BOW-AND-ARROW","CHOKES"],
["CLOSED GUARD","BUTTERFLY","HALF GUARD","DEEP HALF","GUARDS"]
],


/* ROUND 50 */
[
["MARCelo GARCIA","RAFAEL MENDES","GORDON RYAN","ROGER GRACIE","ALL-TIME GREAT NAMES"],
["DE LA RIVA","BUTTERFLY","X-GUARD","SPIDER","GUARDS"],
["ARMBAR","TRIANGLE","KIMURA","OMOPLATA","SUBMISSIONS"],
["LEG DRAG","TORIANDO","KNEE CUT","SMASH PASS","PASSES"]
]

];


/*
=========================================================
GAME VARIABLES
=========================================================
*/

let used = [];

let puzzle = null;

let words = [];

let selected = [];

let solved = [];

let mistakes = 4;

let round = 0;


/*
=========================================================
TOTAL CONNECTIONS
=========================================================

The number is saved in the browser.

So if you close the page and reopen it,
your total remains.
*/

let totalConnections =
  Number(
    localStorage.getItem(
      "bjjTotalConnections"
    )
  ) || 0;


/*
=========================================================
ELEMENTS
=========================================================
*/

const grid =
  document.getElementById("grid");

const solvedBox =
  document.getElementById("solved");

const msg =
  document.getElementById("msg");

const mistakesEl =
  document.getElementById("mistakes");

const dots =
  document.getElementById("dots");

const submit =
  document.getElementById("submit");

const next =
  document.getElementById("next");

const roundNo =
  document.getElementById("roundNo");

const connectionCount =
  document.getElementById(
    "connectionCount"
  );


connectionCount.textContent =
  totalConnections;


/*
=========================================================
START NEW ROUND
=========================================================
*/

function newRound() {

  /*
  Once all 50 rounds have been played,
  start a new cycle.
  */

  if (
    used.length === rounds.length
  ) {

    used = [];

  }


  /*
  Pick a puzzle that has not been played
  during the current cycle.
  */

  const available =
    rounds
      .map(
        (_, i) => i
      )
      .filter(
        i => !used.includes(i)
      );


  const index =
    available[
      Math.floor(
        Math.random() *
        available.length
      )
    ];


  used.push(index);

  puzzle =
    rounds[index];


  /*
  Extract the 16 words.
  */

  words =
    puzzle.flatMap(
      group =>
        group.slice(0, 4)
    );


  selected = [];

  solved = [];

  mistakes = 4;

  round++;


  msg.textContent = "";

  next.style.display =
    "none";


  renderSolved();

  shuffle();

  update();

}


/*
=========================================================
RENDER WORDS
=========================================================
*/

function render() {

  grid.innerHTML = "";


  words.forEach(word => {

    const button =
      document.createElement(
        "button"
      );


    button.className =
      "word";


    button.textContent =
      word;


    if (
      selected.includes(word)
    ) {

      button.classList.add(
        "sel"
      );

    }


    button.onclick =
      function() {

        if (
          selected.includes(word)
        ) {

          selected =
            selected.filter(
              x => x !== word
            );

        }

        else {

          if (
            selected.length >= 4
          ) {

            return;

          }

          selected.push(word);

        }


        render();

        update();

      };


    grid.appendChild(button);

  });

}


/*
=========================================================
SUBMIT GUESS
=========================================================
*/

function submitGuess() {

  if (
    selected.length !== 4
  ) {

    return;

  }


  /*
  Find a group containing all
  four selected words.
  */

  const found =
    puzzle.find(
      group => {

        const groupWords =
          group.slice(0, 4);


        return selected.every(
          word =>
            groupWords.includes(
              word
            )
        );

      }
    );


  /*
  CORRECT
  */

  if (found) {

    solved.push(found);


    /*
    ADD ONE TO TOTAL CONNECTIONS
    */

    totalConnections++;


    /*
    SAVE IT PERMANENTLY
    */

    localStorage.setItem(
      "bjjTotalConnections",
      totalConnections
    );


    /*
    UPDATE THE COUNTER
    */

    connectionCount.textContent =
      totalConnections;


    /*
    Remove solved words.
    */

    words =
      words.filter(
        word =>
          !found
            .slice(0, 4)
            .includes(word)
      );


    selected = [];


    msg.textContent =
      "Correct.";


    renderSolved();

    render();


    /*
    ALL FOUR GROUPS SOLVED
    */

    if (
      words.length === 0
    ) {

      msg.textContent =
        "Round complete.";

      next.style.display =
        "inline-block";

    }

  }


  /*
  WRONG
  */

  else {

    mistakes--;

    selected = [];


    if (
      mistakes === 0
    ) {

      msg.textContent =
        "Game over. Start the next round.";

      next.style.display =
        "inline-block";

    }

    else {

      msg.textContent =
        "Not a group.";

    }


    render();

  }


  update();

}


/*
=========================================================
RENDER SOLVED GROUPS
=========================================================
*/

function renderSolved() {

  solvedBox.innerHTML = "";


  solved.forEach(
    group => {

      const box =
        document.createElement(
          "div"
        );


      box.className =
        "solved";


      box.innerHTML =
        "<b>" +
        group[4] +
        "</b>" +
        group
          .slice(0, 4)
          .join(" · ");


      solvedBox.appendChild(
        box
      );

    }
  );

}


/*
=========================================================
SHUFFLE WORDS
=========================================================
*/

function shuffle() {

  for (
    let i = words.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      words[i],
      words[j]
    ] =
    [
      words[j],
      words[i]
    ];

  }


  render();

}


/*
=========================================================
UPDATE GAME INFO
=========================================================
*/

function update() {

  mistakesEl.textContent =
    mistakes;


  dots.textContent =
    "● ".repeat(
      mistakes
    ).trim();


  submit.disabled =
    selected.length !== 4;


  roundNo.textContent =
    round;

}


/*
=========================================================
BUTTONS
=========================================================
*/

submit.onclick =
  submitGuess;


document.getElementById(
  "shuffle"
).onclick =
  shuffle;


next.onclick =
  newRound;


/*
=========================================================
START GAME
=========================================================
*/

newRound();

</script>

</body>
</html>
