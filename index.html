<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A daily Connections-style puzzle for Brazilian Jiu-Jitsu.">
<title>BJJ Connections</title><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap"><header><div class="eyebrow">THE DAILY BJJ PUZZLE</div><h1>BJJ Connections</h1><div class="creator">Created by Gabe Shaffer</div><p class="sub">Find four groups of four. Learn BJJ history, athletes, techniques, positions, and more.</p></header>
<nav class="tabs"><button class="tab active" data-mode="daily">Daily</button><button class="tab" data-mode="training">Training</button><button class="tab" data-mode="stats">Stats</button></nav>
<section id="gameView"><div id="difficultyWrap" class="difficulty hidden"></div><div class="meta" id="puzzleMeta"></div>
<div class="status"><span>Mistakes: <span id="mistakes">4</span></span><span id="dots">● ● ● ●</span></div>
<div id="solved"></div><div class="grid" id="grid"></div><div id="msg"></div>
<div class="buttons"><button class="ctrl" id="shuffle">Shuffle</button><button class="ctrl" id="submit" disabled>Submit</button><button class="ctrl hidden" id="share">Share</button><button class="ctrl hidden" id="next">Next Puzzle</button></div>
<div id="learnPanel" class="panel hidden"><h2>Learn why</h2><div id="learn" class="learn"></div></div></section>
<section id="statsView" class="hidden"><div class="panel"><h2>Your Connections Stats</h2><div class="stats" id="stats"></div><div class="buttons" style="margin-top:12px"><button class="ctrl" id="resetStats">Reset stats</button></div></div></section>
<footer>Daily puzzles are deterministic: everyone gets the same puzzle each day.</footer></main>
<script src="data.js"></script><script src="app.js"></script></body></html>
